<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stillness</title>
  <meta name="description" content="A quiet mountain lake to rest your eyes and mind." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene" aria-label="An animated mountain lake scene"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="brand ui">
    <h1>Stillness</h1>
    <p>a quiet place to rest</p>
  </header>

  <div class="clock ui" id="clock" aria-live="polite"></div>

  <p class="whisper" id="whisper"></p>

  <div class="breath" id="breath" aria-hidden="true">
    <div class="ring" id="ring"></div>
    <span id="breathText">breathe in</span>
  </div>

  <nav class="dock ui" aria-label="Scene controls">
    <button class="icon-btn" id="soundBtn" aria-pressed="false" title="Sound (S)">
      <svg viewBox="0 0 24 24" class="ico-off"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
      <svg viewBox="0 0 24 24" class="ico-on"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <span class="label">Sound</span>
    </button>

    <span class="sep" aria-hidden="true"></span>

    <div class="seg" role="group" aria-label="Time of day">
      <button data-time="dawn">Dawn</button>
      <button data-time="day">Day</button>
      <button data-time="dusk">Dusk</button>
      <button data-time="night">Night</button>
      <button data-mode="live" title="Follow your local time">Live</button>
      <button data-mode="flow" title="Let the day drift by">Flow</button>
    </div>

    <span class="sep" aria-hidden="true"></span>

    <button class="icon-btn" id="breathBtn" aria-pressed="false" title="Breathe (B)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8" opacity=".5"/></svg>
      <span class="label">Breathe</span>
    </button>
    <button class="icon-btn" id="hideBtn" title="Hide interface (H)">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
      <span class="label">Hide</span>
    </button>
  </nav>

  <p class="hint" id="hint">Press <kbd>H</kbd> or click to bring the controls back</p>

  <script src="main.js"></script>
</body>
</html>
